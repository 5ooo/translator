[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-offline"
version = "0.1.0"
description = "离线终端中英翻译与图片 OCR"
requires-python = ">=3.10"
dependencies = [
    "argostranslate==1.9.6",
    "ctranslate2>=4.0,<5",
    "langid==1.1.6",
    "Pillow>=10,<13",
    "rich==14.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
ts = "ts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: 需要真实本地模型或系统 OCR 的集成测试"]
